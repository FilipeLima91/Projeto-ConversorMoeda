<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <link rel="javascript" href="./script.js">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <title>Desafio - Conversor de moeda</title>
</head>

<body>
    <img alt="logo-gif" src="./assest/logo.gif">

    <main>
        <label>
            Converter <b>de</b>
            <select>
                <option>R$ Real brasileiro</option>
            </select>
        </label>
        <label>
            Converter <b>de</b>
            <select>
                <option>U$ Dólar mericano</option>
                <option>€ Euro</option>
            </select>
        </label>
        <label>
            Valor
            <input placeholder="R$ 0,00">
        </label>
        <section>
            <div>
                <img src="./assest/real.png" alt="moeda-a-converter">
                <p>Real</p>
                <p>R$ 0,00</p>
            </div>
            <img src="./assest/seta.png" alt="seta">
            <div>
                <img src="./assest/dolar.png" alt="moeda-convertida">
                <p>Dólar</p>
                <p>U$ 0,00</p>
            </div>
        </section>


    </main>
</body>

</html>
